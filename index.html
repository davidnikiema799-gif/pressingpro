<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2238A6">
<meta name="color-scheme" content="light">
<meta name="description" content="Gestion de pressing : dépôts, tickets, retraits, caisse et WhatsApp.">
<title>PressingPro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F6; --card:#FFFFFF; --ink:#15212C; --ink-2:#566676; --line:#D6DEE4;
  --bleu:#2238A6; --bleu-d:#1A2C85; --bleu-2:#E7EBFA;
  --tag:#F3CB3F; --tag-ink:#322800;
  --vert:#18744E; --vert-2:#E1F2E9;
  --rouge:#B3372A; --rouge-2:#FBE8E5;
  --ambre:#8F5600; --ambre-2:#FDF0DA;
  --r:10px; --nav-h:64px;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
#app{max-width:680px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
h1{font-size:24px}
h2{font-size:17px}
p{margin:0 0 10px}
a{color:var(--bleu)}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}
.pad{padding:12px 4px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}

/* Barres de titre */
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 10px;min-height:66px}
.bar h1{flex:1;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-end{margin-left:auto;display:flex;align-items:center;gap:6px}
.bar .icon-btn{margin-left:-10px}
.home-head{padding:22px 0 14px}
.home-head h1{font-size:28px}
.home-head p{margin:2px 0 0}

/* Étiquette de ticket : l'élément signature */
.tag{--hole:var(--card);position:relative;display:inline-flex;align-items:center;flex:none;min-width:66px;height:30px;padding:0 10px 0 22px;background:var(--tag);color:var(--tag-ink);font:700 18px/1 var(--cond);letter-spacing:.3px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);border-radius:0 4px 4px 0;white-space:nowrap}
.tag::before{content:'';position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--hole)}
.tag-lg{height:44px;font-size:28px;padding:0 14px 0 30px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
.tag-lg::before{left:14px;width:9px;height:9px;margin-top:-4.5px}
.bar .tag{--hole:var(--paper)}

.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-depose{background:#E6EBF0;color:#3F4D5A}
.st-traitement{background:var(--bleu-2);color:var(--bleu)}
.st-pret{background:var(--vert-2);color:var(--vert)}
.st-retire{color:var(--ink-2);border:1px solid var(--line);padding:2px 9px}
.st-annule{background:var(--rouge-2);color:var(--rouge)}
.xp{font-style:normal;font-size:12px;font-weight:700;color:var(--ambre);background:var(--ambre-2);padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.bar .xp{margin-right:0}
.due{color:var(--rouge);font-weight:600}
.late{color:var(--rouge);font-weight:600}
.warn{color:var(--ambre);font-weight:600}
.cnt{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--line);color:var(--ink);font-size:13px;font-weight:600;text-align:center;margin-left:6px;vertical-align:1px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:8px;border:1px solid transparent;font:inherit;font-weight:600;font-size:16px;line-height:1.15;text-decoration:none;cursor:pointer;background:var(--card);color:var(--ink);text-align:center}
.btn-p{background:var(--bleu);color:#fff}
.btn-p:active{background:var(--bleu-d)}
.btn-g{background:var(--vert);color:#fff}
.btn-l{border-color:var(--line)}
.btn-l:active{background:var(--paper)}
.btn-d{color:var(--rouge);border-color:#EBC3BC}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.45}
.btn-t{background:none;border:0;color:var(--bleu);font:inherit;font-weight:600;font-size:15px;padding:8px 4px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn-t.block{display:flex;justify-content:center;width:100%}
.btn-t.sm{font-size:14px;min-height:34px;padding:4px 0}
.armed{background:var(--rouge)!important;color:#fff!important;border-color:var(--rouge)!important;border-radius:8px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.btn-row>.btn{flex:1 1 auto}
.btn-col{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;border:0;background:none;color:var(--ink);cursor:pointer;flex:none}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:18px;height:18px}
.wa-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--vert);color:#fff;margin-right:12px;flex:none}

/* Champs */
.fld{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.fld>span{font-size:14px;font-weight:500;color:var(--ink-2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:48px;width:100%;min-width:0}
textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bleu);outline-offset:-1px;border-color:var(--bleu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:end}
@media (max-width:370px){.grid2{grid-template-columns:1fr}}
.hint{font-size:14px;color:var(--ink-2);margin:4px 0 10px}
.fld .hint{margin:0}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 12px;height:52px;margin:0 0 14px}
.search input{border:0;height:48px;padding:0;background:none}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--bleu);outline-offset:-1px;border-color:var(--bleu)}
.search svg{color:var(--ink-2)}
.search.big{height:62px;padding-left:10px;padding-right:8px;border-width:2px}
.search.big input{font-size:18px}
.scan-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;border:0;background:var(--ink);color:#fff;flex:none;cursor:pointer}
.search.big .scan-btn{width:46px;height:46px}

/* Scanner */
.scan-box{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:0 auto}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:20% 16%;border:3px solid var(--tag);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-msg{text-align:center;margin:12px 8px}

/* Page vue par un client qui scanne son ticket */
.public{text-align:center;padding:40px 4px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.public h1{font-size:24px;margin-top:8px}
.public p{color:var(--ink-2);max-width:32ch}
.public .tag{--hole:var(--paper)}

.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.seg-scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
.seg-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sm{height:34px;padding:0 12px;font-size:14px}
.chip .n{margin-left:6px;opacity:.65}

/* Cartes et listes */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card>h2{margin-bottom:8px}
.card.ok{background:var(--vert-2);border-color:#BFE3CF}
.card.backup-warn{background:var(--ambre-2);border-color:#EBD3A2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.card.backup-warn p{flex:1 1 220px;margin:0}
.card.warn-card{background:var(--rouge-2);border-color:#EFC4BC}
.card.calm{color:var(--ink-2);display:flex;align-items:center;gap:8px}
.install-card{display:flex;gap:14px;align-items:flex-start;border-color:#C9D2F3;background:var(--bleu-2)}
.install-card img{border-radius:12px;flex:none}
.install-card p{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.install-card .btn-row{margin:10px 0 0}
.card.empty{text-align:center;padding:26px 16px;color:var(--ink-2)}
.sect{margin:18px 0}
.sect>h2{margin-bottom:10px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:24px 0 8px}
.sec-h .muted{font-size:14px}
.grp-h{font-size:15px;font-weight:600;margin:16px 0 8px;color:var(--ink-2)}

.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;color:inherit;text-decoration:none}
.row:active{background:var(--paper)}
.row-wrap{display:flex;align-items:center}
.row-wrap .row{flex:1;min-width:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{color:var(--ink-2);font-size:14px}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row-end small{font-size:14px}
.card-link{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.card-link .chev{color:var(--ink-2);font-size:22px}

/* Caisse façon ticket de caisse */
.receipt{position:relative;background:var(--card);padding:16px 16px 20px;margin:24px 0 30px;filter:drop-shadow(0 0 1px rgba(21,33,44,.28))}
.receipt::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(135deg,var(--card) 50%,transparent 50%) 0 0/14px 10px repeat-x,linear-gradient(225deg,var(--card) 50%,transparent 50%) 0 0/14px 10px repeat-x}
.receipt-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.receipt-head .seg{margin:0}
.chip svg{width:16px;height:16px;margin:0 5px -3px -2px}
.period{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.date-nav{display:flex;align-items:center;gap:6px;margin:6px 0 4px}
.date-nav input{flex:1;text-align:center;font-weight:600}
.date-nav .icon-btn{border:1px solid var(--line);color:var(--bleu)}
.date-nav .icon-btn:disabled{color:var(--line);cursor:default}
.rl{display:flex;align-items:baseline;gap:8px;padding:5px 0;color:inherit;text-decoration:none}
.rl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl i{flex:1;min-width:12px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.rl b{font:600 19px var(--cond);white-space:nowrap}
.rl.big span{font-weight:600}
.rl.big b{font-size:32px;font-weight:700;color:var(--bleu)}
.rl.sub{padding-left:14px;font-size:15px;color:var(--ink-2)}
.rl.sub b{font-size:17px;color:var(--ink)}
.rl.link span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
hr.dash{border:0;border-top:2px dashed var(--line);margin:10px 0}

/* Formulaire de dépôt */
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.art{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:66px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:inherit;text-align:left;color:var(--ink);cursor:pointer}
.art span{font-weight:600;font-size:15px;line-height:1.15}
.art small{color:var(--ink-2);font-size:14px}
.art:active{background:var(--bleu-2);border-color:var(--bleu)}
.art[disabled]{opacity:.4;cursor:default}
.art.has{border-color:var(--bleu);box-shadow:inset 0 0 0 1px var(--bleu)}
.art .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--bleu);color:#fff;font:700 15px/24px var(--cond);text-align:center;padding:0 6px;font-style:normal}
.art-free{border-style:dashed}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.line{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.line-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.line-top b{font-size:17px}
.line-name{height:42px;font-weight:600}
.line-mid{display:flex;gap:10px;align-items:center;margin:8px 0}
.line-mid select{flex:1;height:44px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:44px;flex:none}
.stepper button{width:44px;height:42px;border:0;background:none;font-size:22px;color:var(--bleu);cursor:pointer;display:grid;place-items:center}
.stepper span{min-width:28px;text-align:center;font:700 20px var(--cond)}
.line-bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pu{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px}
.pu input{width:96px;height:40px}
.lt{font:700 20px var(--cond)}
.line-note{margin-top:8px;height:42px}
.empty-lines{color:var(--ink-2);font-size:15px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:var(--r);margin:0}
.fdetail{font-size:14px;color:var(--ink-2);text-align:right;margin:12px 0 0;min-height:1em}
.sugg{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border:1px solid #C9D2F3;border-radius:8px;background:var(--bleu-2);margin:0 0 6px;font:inherit;cursor:pointer;color:var(--ink);text-align:left}
.sugg span{color:var(--ink-2)}
.cinfo{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:-2px 0 4px}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;margin-bottom:8px;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:46px;height:28px;border-radius:14px;background:#C3CDD5;position:relative;transition:background .2s;flex:none}
.switch .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.sw{background:var(--bleu)}
.switch input:checked+.sw::after{transform:translateX(18px)}
.switch input:focus-visible+.sw{outline:2px solid var(--bleu);outline-offset:2px}
.switch small{color:var(--ink-2)}
.sticky-foot{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;gap:12px;margin:18px -4px 0;padding:10px 10px 10px 16px;background:var(--ink);color:#fff;border-radius:12px;z-index:5}
.tot{flex:1;display:flex;flex-direction:column;line-height:1.1;min-width:0}
.tot span{font-size:13px;opacity:.7}
.tot b{font:700 28px var(--cond)}
.tot small{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticky-foot .btn{background:var(--tag);color:var(--tag-ink);padding:0 16px}

/* Détail de commande */
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0;margin:6px 0 16px}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:7px;background:none;border:0;padding:0 0 4px;font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;text-align:left;border-radius:4px}
.steps button::before{content:'';display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.steps .done button,.steps .cur button{color:var(--ink)}
.steps .done button::before{background:var(--bleu)}
.steps .cur button{font-weight:700}
.steps .cur button::before{background:var(--bleu)}
.steps .cur.s-pret button::before,.steps .cur.s-retire button::before{background:var(--vert)}
.steps button:disabled{cursor:default}
.steps button.armed{padding:4px}
.big-wa{min-height:56px;font-size:17px}
.notified{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;background:var(--vert-2);color:var(--vert);border-radius:var(--r);font-weight:500}
.notified span{display:flex;align-items:center;gap:6px}
.cli-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cli-top b{display:block;font-size:18px}
.cli-top .muted{font-size:15px}
.dl{list-style:none;margin:6px 0 0;padding:0}
.dl li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.dl li>b{white-space:nowrap}
.dl small{display:block;color:var(--ink-2);font-size:14px}
.note{color:var(--ambre)!important;font-size:14px}
.tots{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.tl{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.tl.total{font-weight:700;font-size:18px}
.tl.due b{color:var(--rouge)}
.tl.ok-t b{color:var(--vert)}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pl li:first-child{border-top:0}
.pl span{flex:1}
.pl small{display:block;color:var(--ink-2);font-size:13px}
.dates .tl span:first-child{color:var(--ink-2)}

/* Tarifs */
.tarifs,.svc-list{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:10px}
.tarif{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tarif-top,.svc-list li{display:flex;gap:6px;align-items:center}
.tarif-top{margin-bottom:8px}
.tarif-nom{font-weight:600}
.tarif-prix{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tarif-prix label{display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:12.5px;color:var(--ink-2);line-height:1.2}
.tarif-prix input{height:42px}
details.danger{margin:24px 0;padding:12px 16px;border:1px solid #EFC4BC;border-radius:var(--r);background:var(--card)}
details.danger summary{cursor:pointer;font-weight:600;color:var(--rouge)}
.foot{text-align:center;color:var(--ink-2);font-size:13px;margin:28px 0 8px}
.file-btn{position:relative}

/* Navigation */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav a{flex:1;max-width:136px;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);text-decoration:none;font-size:12.5px;font-weight:500}
#nav a[aria-current]{color:var(--bleu);font-weight:600}
#nav a[aria-current] svg{stroke-width:2.3}
#nav .plus{display:grid;place-items:center;width:54px;height:54px;margin-top:-24px;border-radius:50%;background:var(--bleu);color:#fff;border:4px solid var(--card)}
#nav .plus svg{width:26px;height:26px;stroke-width:2.4}

/* Bandeau si Chrome est en mode « Version pour ordinateur » : tout est rétréci, d'où la grande taille */
#dm{background:var(--ambre-2);color:var(--ambre);border-bottom:2px solid #EBD3A2;padding:24px 28px;font-size:34px;line-height:1.3;font-weight:600;text-align:center}

/* Messages éphémères */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);width:max-content;transition:opacity .25s,transform .25s;z-index:50;text-align:center;box-shadow:0 6px 20px rgba(21,33,44,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--rouge)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Ticket imprimé
   Les styles s'appliquent aussi à l'écran (hors champ, classe .measure) pour mesurer la hauteur
   du ticket : la page imprimée fait alors exactement la taille du ticket.
   --ticket-w = zone imprimable (48 mm sur un rouleau de 58, 72 mm sur un rouleau de 80). */
#print{display:none;width:var(--ticket-w,48mm);color:#000;background:#fff;font:var(--ticket-fs,10pt)/1.3 Arial,Helvetica,sans-serif}
#print.measure{display:block;position:absolute;left:-9999px;top:0}
#print .tk-h{text-align:center}
#print .tk-h b{display:block;font-size:1.3em}
#print .tk-num{text-align:center;font-weight:700;font-size:2.2em;line-height:1.1;border:2px solid #000;margin:6px 0;padding:2px 0}
#print .tk-x{text-align:center;font-weight:700;letter-spacing:2px;margin-bottom:4px}
#print table{width:100%;border-collapse:collapse}
#print td{padding:2px 0;vertical-align:top}
#print td:last-child{text-align:right;white-space:nowrap;padding-left:6px}
#print small{font-size:.85em}
#print .tk-tot{display:flex;justify-content:space-between;gap:6px}
#print .tk-tot.b{font-weight:700;font-size:1.1em}
#print .tk-sep{border-top:1px dashed #000;margin:5px 0}
#print .tk-rdv{text-align:center}
#print .tk-pied{text-align:center;font-size:.85em;margin:6px 0 0}
#print .tk-cut{border-top:1px dashed #000;margin:14px 0 8px;padding-top:2px;text-align:center;font-size:.8em}
#print .tk-e .tk-num{font-size:3em}
#print .tk-qr{text-align:center;margin:8px 0 0}
#print .tk-qr svg{display:block;margin:0 auto 2px;stroke:none;fill:#000}
@media print{
  html,body{background:#fff;margin:0;padding:0}
  #app,#nav,#toast,#dm{display:none!important}
  #print{display:block}
}
</style>
<style id="page-style"></style>
</head>

function migrate(d) {
  const def = defaultState();
  d.settings = {...def.settings, ...(d.settings || {})};
  d.services = Array.isArray(d.services) && d.services.length ? d.services : def.services;
  d.articles = Array.isArray(d.articles) ? d.articles : def.articles;
  d.clients = Array.isArray(d.clients) ? d.clients : [];
  d.commandes = (Array.isArray(d.commandes) ? d.commandes : []).map(c => ({lignes: [], paiements: [], historique: [], ...c}));
  d.v = 1;

/* Stockage : IndexedDB (plus de place que localStorage), repli sur localStorage */
const Store = {
  db: null, ls: false,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('pressingpro', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.ls = true; }
  },
  load() {
    if (this.ls) { const t = localStorage.getItem('pressingpro'); return Promise.resolve(t ? JSON.parse(t) : null); }
    return new Promise((res, rej) => {
      const q = this.db.transaction('kv').objectStore('kv').get('state');
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  },
  save(s) {
    if (this.ls) { localStorage.setItem('pressingpro', JSON.stringify(s)); return Promise.resolve(); }
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(s, 'state');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
};
function save() {
  Store.save(S).catch(err => { console.error(err); toast("Échec de l'enregistrement. La mémoire du téléphone est peut-être pleine.", 'err'); });
}

/* ---------- Règles métier ---------- */
const client = id => S.clients.find(c => c.id === id);
const cmd = id => S.commandes.find(c => c.id === id);
const actives = () => S.commandes.filter(c => c.statut !== 'annule');
const paye = c => sum(c.paiements.map(p => p.montant));
const reste = c => c.statut === 'annule' ? 0 : Math.max(0, c.total - paye(c));
const nbArt = c => sum(c.lignes.map(l => l.qte));
const enRetard = c => (c.statut === 'depose' || c.statut === 'traitement') && c.dateRetraitPrevue < dISO();
const oublie = c => c.statut === 'pret' && c.datePret && daysBetween(c.datePret, dISO()) >= (+S.settings.joursOubli || 30);
const numFmt = n => (S.settings.prefixe ? S.settings.prefixe + '-' : '') + String(n).padStart(4, '0');

function calc(lignes, express, remise, pct = S.settings.expressPct) {
  const brut = sum(lignes.map(l => l.qte * l.pu));
  const maj = express ? Math.ceil(brut * (+pct || 0) / 100 / 25) * 25 : 0;
  const rem = Math.min(Math.max(0, Math.round(+remise || 0)), brut + maj);
  return {brut, maj, rem, total: brut + maj - rem};
}

function setStatut(c, s) {
  if (c.statut === s) return;
  const from = ORDRE.indexOf(c.statut), to = ORDRE.indexOf(s), now = new Date().toISOString();
  c.statut = s;
  c.historique.push({statut: s, date: now});
  if (to >= 2 && from < 2) { c.datePret = now; c.notifieLe = null; }
  if (to === 3) c.dateRetrait = now; else c.dateRetrait = null;
  if (to < 2) { c.datePret = null; c.notifieLe = null; }
  save();
}

function waLink(tel, text) {
  let d = digits(tel);
  if (d.startsWith('00')) d = d.slice(2);
  if (d && d.length <= 8) d = digits(S.settings.indicatif) + d;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}

function fill(tpl, c) {
  const cl = client(c.clientId) || {}, r = reste(c);
  return String(tpl || '')
    .replace(/\{client\}/g, cl.nom || '')
    .replace(/\{ticket\}/g, c.num)
    .replace(/\{pressing\}/g, S.settings.nom)
    .replace(/\{reste\}/g, r > 0 ? `Reste à payer : ${moneyT(r)}.` : 'Tout est déjà réglé.')
    .replace(/\{date_pret\}/g, fDate(c.datePret))
    .trim();
}

function recuTexte(c) {
  const s = S.settings, cl = client(c.clientId) || {}, r = reste(c), L = [];
  L.push(`*${s.nom}*`);
  if (s.tel) L.push('Tél. ' + s.tel);
  L.push('', `Ticket *${c.num}*${c.express ? ' (express)' : ''}`, `Client : ${cl.nom || ''}`, `Déposé le ${fDate(c.dateDepot)}`, '');
  c.lignes.forEach(l => {
    L.push(`${l.qte} × ${l.nom} (${l.serviceNom}) : ${moneyT(l.qte * l.pu)}`);
    if (l.note) L.push(`   ↳ ${l.note}`);
  });
  L.push('');
  if (c.maj) L.push(`Express (+${c.expressPct} %) : ${moneyT(c.maj)}`);
  if (c.remise) L.push(`Remise : -${moneyT(c.remise)}`);
  L.push(`*Total : ${moneyT(c.total)}*`, `Payé : ${moneyT(paye(c))}`);
  L.push(r > 0 ? `*Reste à payer : ${moneyT(r)}*` : '*Tout est réglé*');
  L.push('', `Retrait prévu le ${fDate(c.dateRetraitPrevue)}`);
  if (s.pied) L.push('', s.pied);
  return L.join('\n');
}

function matchQ(c, q) {
  q = q.trim();
  if (!q) return true;
  const cl = client(c.clientId) || {};
  const d = digits(q), letters = q.replace(/[^a-zA-ZÀ-ſ]/g, '');
  if (d && letters.length <= 2) {
    if (parseInt(digits(c.num), 10) === parseInt(d, 10)) return true;
    if (!letters && d.length >= 4 && digits(cl.tel).includes(d)) return true;
    return false;
  }
  return norm(cl.nom).includes(norm(q)) || norm(c.num).includes(norm(q));
}

/* ---------- Accueil ---------- */
// Bornes [début, fin] d'une période de caisse, en jours ISO (AAAA-MM-JJ), fin incluse
function bornes(per) {
  const today = dISO();
  if (per === 'semaine') return [addDays(-6), today];
  if (per === 'mois') return [today.slice(0, 8) + '01', today];
  if (per === 'date') return [caisseDate, caisseDate];
  return [today, today];
}
function stats(per) {
  const [from, to] = bornes(per);
  const inP = iso => { if (!iso) return false; const d = dayOf(iso); return d >= from && d <= to; };
  const act = actives(), pays = [];
  act.forEach(c => c.paiements.forEach(p => { if (inP(p.date)) pays.push(p); }));
  const byMode = {};
  pays.forEach(p => byMode[p.mode] = (byMode[p.mode] || 0) + p.montant);
  const dep = act.filter(c => inP(c.dateDepot));
  return {
    encaisse: sum(pays.map(p => p.montant)), byMode,
    nbDep: dep.length, nbArt: sum(dep.map(nbArt)), ca: sum(dep.map(c => c.total)),
    remis: act.filter(c => c.statut === 'retire' && inP(c.dateRetrait)).length
  };
}
// Premier jour où l'app a enregistré quelque chose : on ne propose pas de remonter avant
function premierJour() {
  let min = dISO();
  S.commandes.forEach(c => {
    if (dayOf(c.dateDepot) < min) min = dayOf(c.dateDepot);
    c.paiements.forEach(p => { if (p.date && dayOf(p.date) < min) min = dayOf(p.date); });
  });
  return min;
}
const jourLong = iso => { const s = toDate(iso).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}); return s.charAt(0).toUpperCase() + s.slice(1); };
function ilYa(iso) {
  const n = daysBetween(iso, dISO());
  return n === 0 ? "aujourd'hui" : n === 1 ? 'hier' : `il y a ${n} jours`;
}

function caisseHTML() {
  const st = stats(periode), imp = sum(actives().map(reste)), today = dISO();
  const P = {jour: "Aujourd'hui", semaine: '7 jours', mois: 'Ce mois'};
  const [from, to] = bornes(periode);

        <input id="c-date" type="date" data-ch="cdate" value="${caisseDate}" min="${min}" max="${today}" aria-label="Date à consulter">
        <button class="icon-btn" data-a="cnext" aria-label="Jour suivant" ${caisseDate >= today ? 'disabled' : ''}>${I.next}</button>
      </div>

  } else {
    quand = `<p class="period">${from === to ? jourLong(from) : `Du ${fDate(from)} au ${fDate(to)}`}</p>`;
  }
  return `<section class="receipt" aria-label="Caisse">
    <div class="receipt-head"><h2>Caisse</h2><div class="seg">${Object.entries(P).map(([k, v]) => `<button class="chip sm ${periode === k ? 'on' : ''}" data-a="periode" data-id="${k}">${v}</button>`).join('')}<button class="chip sm ${periode === 'date' ? 'on' : ''}" data-a="periode" data-id="date">${I.cal}${periode === 'date' ? fDate(caisseDate).slice(0, 5) : 'Autre date'}</button></div></div>
    ${quand}

    ${MODES.map(m => `<div class="rl sub"><span>${m}</span><i></i><b>${money(st.byMode[m] || 0)}</b></div>`).join('')}
    <hr class="dash">

    <div class="rl"><span>Valeur des dépôts</span><i></i><b>${money(st.ca)}</b></div>
    <div class="rl"><span>Remis aux clients</span><i></i><b>${st.remis}</b></div>

    <a class="rl link" href="#/commandes/impaye"><span>Impayés en cours</span><i></i><b class="${imp ? 'due' : ''}">${money(imp)}</b></a>
  </section>`;
}

  h += caisseHTML();
  return h;

  impaye: {label: 'Impayés', f: c => reste(c) > 0, sort: (a, b) => a.dateDepot.localeCompare(b.dateDepot)},
  retire: {label: 'Retirés', f: c => c.statut === 'retire', sort: (a, b) => b.dateRetrait.localeCompare(a.dateRetrait)},
  toutes: {label: 'Toutes', f: () => true, sort: (a, b) => b.dateDepot.localeCompare(a.dateDepot)}
};

function cmdListHTML() {
  const q = cmdQ.trim();

    return `<div class="card empty"><p>${vide[cmdFilter]}</p>${cmdFilter === 'toutes' || cmdFilter === 'encours' ? `<a class="btn btn-p" href="#/depot">${I.plus} Nouveau dépôt</a>` : ''}</div>`;
  }
  const shown = list.slice(0, cmdLimit);
  return note + `<div class="list">${shown.map(c => rowCmd(c)).join('')}</div>` +
    (list.length > cmdLimit ? `<button class="btn btn-l block" style="margin-top:12px" data-a="more">Afficher plus (${list.length - cmdLimit} restantes)</button>` : '');
}

function vCommandes(f) {
  if (f && FILTRES[f]) cmdFilter = f;
  const chips = Object.entries(FILTRES).map(([k, v]) => {
    const n = k === 'toutes' ? '' : S.commandes.filter(v.f).length;
    return `<button class="chip ${cmdFilter === k ? 'on' : ''}" data-a="cfilter" data-id="${k}">${v.label}${n !== '' ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
  return `<header class="bar"><h1>Commandes</h1></header>
    <label class="search">${I.search}<input type="search" data-in="qcmd" value="${esc(cmdQ)}" placeholder="N° de ticket, nom ou téléphone" autocomplete="off" aria-label="Rechercher une commande"><button class="scan-btn" data-a="scan" aria-label="Scanner le QR code d'un ticket">${I.qr}</button></label>
    <div class="seg seg-scroll">${chips}</div>
    <div id="cmd-list">${cmdListHTML()}</div>`;
}

/* ---------- Détail d'une commande ---------- */
function stepsHTML(c) {
  const i = ORDRE.indexOf(c.statut);
  return `<ol class="steps" aria-label="Étapes de la commande">${ORDRE.map((s, j) =>
    `<li class="${j < i ? 'done' : j === i ? 'cur s-' + s : ''}"><button data-a="setst" data-id="${c.id}" data-s="${s}" ${j === i ? 'aria-current="step" disabled' : ''} ${j < i ? 'data-confirm="Revenir ici ?"' : ''}>${STATUTS[s]}</button></li>`
  ).join('')}</ol>`;
}

function payFields(r, withValue) {
  return `<label class="fld"><span>Montant reçu (F)</span><input id="pay-m" type="number" inputmode="numeric" min="0" ${withValue ? `value="${r}"` : `placeholder="${r}"`} data-in="paym" data-r="${r}"></label>
    <div class="seg">${modeChips(payMode)}</div><p class="hint" id="pay-rendre"></p>`;
}

function remiseHTML(c, r) {
  return `<section class="card" id="remise"><h2>Remettre au client</h2>${r > 0
    ? `<p>Reste à payer : <b class="due">${money(r)}</b></p>${payFields(r, true)}
       <button class="btn btn-p block" data-a="remettre" data-id="${c.id}" data-pay="1">${I.check} Encaisser et remettre</button>
       <button class="btn-t block" data-a="remettre" data-id="${c.id}" data-pay="0" data-confirm="Confirmer : remettre avec ${money(r)} de dette">Remettre sans tout payer</button>`
    : `<button class="btn btn-p block" data-a="remettre" data-id="${c.id}" data-pay="0">${I.check} Remettre au client</button>`}</section>`;
}

function payHTML(c, r) {
  return `<section class="card"><h2>Encaisser un paiement</h2><p>Reste à payer : <b class="due">${money(r)}</b></p>${payFields(r, false)}
    <button class="btn btn-p block" data-a="encaisser" data-id="${c.id}">Encaisser</button></section>`;
}

function actionHTML(c, cl, r) {
  const s = c.statut;
  if (s === 'annule') return `<p class="card warn-card">Commande annulée le ${fDate(c.dateAnnule)}. Elle ne compte plus dans la caisse.</p>`;
  if (s === 'retire') return `<p class="card calm">${I.check} Linge remis au client le ${fDateH(c.dateRetrait)}.${r ? ` <b class="due">Il doit encore ${money(r)}.</b>` : ''}</p>`;
  if (s === 'depose' || s === 'traitement') {
    let h = `<div class="btn-col"><button class="btn btn-p block" data-a="setst" data-id="${c.id}" data-s="pret">${I.check} Marquer prêt</button>`;
    if (s === 'depose') h += `<button class="btn btn-l block" data-a="setst" data-id="${c.id}" data-s="traitement">Mettre en traitement</button>`;
    h += '</div>';
    if (ui.remise === c.id) h += remiseHTML(c, r);
    return h;
  }
  let h = '';
  if (!c.notifieLe) {
    h += `<a class="btn btn-g block big-wa" ${waAttrs(cl.tel, fill(S.settings.msgPret, c))} data-a="notif" data-id="${c.id}">${I.chat} Prévenir le client sur WhatsApp</a>`;
    if (!cl.tel) h += `<p class="hint">Pas de numéro enregistré : choisissez le contact dans WhatsApp.</p>`;
  } else {
    h += `<div class="notified"><span>${I.check} Prévenu le ${fDateH(c.notifieLe)}</span><a class="btn-t" ${waAttrs(cl.tel, fill(oublie(c) ? S.settings.msgRelance : S.settings.msgPret, c))} data-a="notif" data-id="${c.id}">Relancer</a></div>`;
  }
  return h + remiseHTML(c, r);
}

function vCommande(id, q) {
  const c = cmd(id);
  if (!c) return notFound("Cette commande n'existe pas ou a été effacée.");
  const cl = client(c.clientId) || {nom: 'Client inconnu', tel: ''};
  const r = reste(c), p = paye(c), annule = c.statut === 'annule';
  let h = `<header class="bar"><a class="icon-btn" href="#/commandes" aria-label="Retour aux commandes">${I.back}</a><span class="tag tag-lg">${esc(c.num)}</span><span class="bar-end">${c.express ? '<em class="xp">Express</em>' : ''}${pill(c)}</span></header>`;

  if (q.nouveau && c.statut === 'depose') {
    h += `<section class="card ok"><p><b>Dépôt enregistré.</b> Remettez le ticket au client.</p>
      <div class="btn-row"><button class="btn btn-p" data-a="print" data-id="${c.id}">${I.print} Imprimer le ticket</button><a class="btn btn-g" ${waAttrs(cl.tel, recuTexte(c))}>${I.chat} Reçu par WhatsApp</a></div></section>`;
  }
  if (!annule) h += stepsHTML(c);
  h += actionHTML(c, cl, r);

  h += `<section class="card"><div class="cli-top"><div><b>${esc(cl.nom)}</b><span class="muted">${esc(cl.tel || 'Pas de téléphone')}</span></div>${cl.id ? `<a class="btn-t" href="#/client/${cl.id}">Fiche client</a>` : ''}</div>
    ${cl.tel ? `<div class="btn-row"><a class="btn btn-l sm" href="tel:${esc(digits(cl.tel))}">${I.phone} Appeler</a><a class="btn btn-l sm" ${waAttrs(cl.tel, '')}>${I.chat} WhatsApp</a></div>` : ''}</section>`;

  h += `<section class="card"><h2>Articles<span class="cnt">${nbArt(c)}</span></h2><ul class="dl">${c.lignes.map(l =>
      `<li><div><b>${l.qte} × ${esc(l.nom)}</b><small>${esc(l.serviceNom)}${l.qte > 1 ? `, ${money(l.pu)} l'unité` : ''}</small>${l.note ? `<small class="note">${esc(l.note)}</small>` : ''}</div><b>${money(l.qte * l.pu)}</b></li>`).join('')}</ul>
    <div class="tots">
      ${c.maj || c.remise ? `<div class="tl"><span>Sous-total</span><span>${money(c.brut)}</span></div>` : ''}
      ${c.maj ? `<div class="tl"><span>Express (+${c.expressPct} %)</span><span>+${money(c.maj)}</span></div>` : ''}
      ${c.remise ? `<div class="tl"><span>Remise</span><span>−${money(c.remise)}</span></div>` : ''}
      <div class="tl total"><span>Total</span><span>${money(c.total)}</span></div>
      <div class="tl"><span>Payé</span><span>${money(p)}</span></div>
      ${annule ? '' : `<div class="tl ${r ? 'due' : 'ok-t'}"><b>${r ? 'Reste à payer' : 'Tout est réglé'}</b><b>${r ? money(r) : ''}</b></div>`}
    </div>${c.note ? `<p class="note" style="margin-top:8px">${esc(c.note)}</p>` : ''}</section>`;

  if (c.paiements.length) {
    h += `<section class="card"><h2>Paiements</h2><ul class="pl">${c.paiements.map(x =>
      `<li><span>${fDateH(x.date)}<small>${esc(x.mode)}</small></span><b>${money(x.montant)}</b><button class="icon-btn sm" data-a="paydel" data-id="${c.id}" data-p="${x.id}" data-confirm="Supprimer ?" aria-label="Supprimer ce paiement">${I.x}</button></li>`).join('')}</ul></section>`;
  }
  if (r > 0 && !annule && c.statut !== 'pret' && ui.remise !== c.id) h += payHTML(c, r);

  h += `<section class="card dates">
    <div class="tl"><span>Déposé le</span><span>${fDateH(c.dateDepot)}</span></div>
    <div class="tl"><span>Retrait prévu le</span><span${enRetard(c) ? ' class="late"' : ''}>${fDate(c.dateRetraitPrevue)}${enRetard(c) ? ', en retard' : ''}</span></div>
    ${c.datePret ? `<div class="tl"><span>Prêt le</span><span>${fDateH(c.datePret)}</span></div>` : ''}
    ${c.dateRetrait ? `<div class="tl"><span>Remis le</span><span>${fDateH(c.dateRetrait)}</span></div>` : ''}
  </section>`;

  h += `<div class="btn-col"><button class="btn btn-l block" data-a="print" data-id="${c.id}">${I.print} Imprimer le ticket</button>`;
  if (!(q.nouveau && c.statut === 'depose')) h += `<a class="btn btn-l block" ${waAttrs(cl.tel, recuTexte(c))}>${I.chat} Envoyer le reçu par WhatsApp</a>`;
  if (!annule && c.statut !== 'retire') h += `<a class="btn btn-l block" href="#/depot/${c.id}">${I.edit} Modifier la commande</a>`;
  if (annule) h += `<button class="btn btn-l block" data-a="retablir" data-id="${c.id}">Rétablir la commande</button>`;
  else if (c.statut !== 'retire') {
    h += `<button class="btn btn-d block" data-a="annuler" data-id="${c.id}" data-confirm="Toucher encore pour annuler">Annuler la commande</button>`;
    if (p) h += `<p class="hint">Les ${money(p)} déjà payés ne compteront plus dans la caisse.</p>`;
  }
  return h + '</div>';
}

/* ---------- Nouveau dépôt / modification ---------- */
function newForm(clientId) {
  const cl = clientId ? client(clientId) : null;
  return {editId: null, clientId: cl ? cl.id : null, tel: cl ? cl.tel : '', nom: cl ? cl.nom : '', lignes: [], express: false, remise: 0,
    date: addDays(+S.settings.delai || 0), note: '', avance: '', mode: 'Espèces', service: S.services[0].id, noteOpen: {}};
}
function editForm(c) {
  const cl = client(c.clientId) || {};
  return {editId: c.id, clientId: c.clientId, tel: cl.tel || '', nom: cl.nom || '', lignes: c.lignes.map(l => ({...l, k: uid()})),
    express: c.express, remise: c.remise || 0, date: c.dateRetraitPrevue, note: c.note || '', avance: '', mode: 'Espèces', service: S.services[0].id, noteOpen: {}};
}
const line = k => F.lignes.find(l => l.k === k);
const svc = id => S.services.find(s => s.id === id) || S.services[0];

function linesHTML() {
  if (!F.lignes.length) return `<p class="empty-lines">Touchez un article pour l'ajouter au dépôt.</p>`;
  return `<ul class="lines">${F.lignes.map(l => `<li class="line">
    <div class="line-top">${l.libre ? `<input class="line-name" data-in="lnom" data-k="${l.k}" value="${esc(l.nom)}" placeholder="Nom de l'article" aria-label="Nom de l'article">` : `<b>${esc(l.nom)}</b>`}
      <button class="icon-btn sm" data-a="ldel" data-k="${l.k}" aria-label="Retirer ${esc(l.nom)}">${I.x}</button></div>
    <div class="line-mid"><select data-ch="lsvc" data-k="${l.k}" aria-label="Service">${S.services.map(sv => `<option value="${sv.id}" ${sv.id === l.serviceId ? 'selected' : ''}>${esc(sv.nom)}</option>`).join('')}</select>
      <div class="stepper"><button type="button" data-a="lmoins" data-k="${l.k}" aria-label="Enlever un">${I.minus}</button><span>${l.qte}</span><button type="button" data-a="lplus" data-k="${l.k}" aria-label="Ajouter un">${I.plus}</button></div></div>
    <div class="line-bot"><label class="pu"><input type="number" inputmode="numeric" min="0" data-in="lpu" data-k="${l.k}" value="${l.pu}" aria-label="Prix unitaire"><span>F l'unité</span></label><b class="lt" id="lt-${l.k}">${money(l.qte * l.pu)}</b></div>
    ${l.note || F.noteOpen[l.k] ? `<input class="line-note" data-in="lnote" data-k="${l.k}" value="${esc(l.note)}" placeholder="Remarque : tache, bouton manquant, couleur…" aria-label="Remarque">` : `<button class="btn-t sm" data-a="lnoteopen" data-k="${l.k}">+ Remarque (tache, défaut…)</button>`}
  </li>`).join('')}</ul>`;
}

function clientInfo() {
  if (!F.clientId) return '';
  const cs = S.commandes.filter(c => c.clientId === F.clientId && c.statut !== 'annule' && c.id !== F.editId);
  const dette = sum(cs.map(reste));
  return `<div class="cinfo"><span>Client déjà enregistré, ${plural(cs.length, 'dépôt')}.</span>${dette ? `<b class="due">Doit encore ${money(dette)}</b>` : ''}<button class="btn-t sm" data-a="fchange">Changer de client</button></div>`;
}

function suggest() {
  const box = $('#f-sugg');
  if (!box) return;
  if (F.clientId) { box.innerHTML = ''; return; }
  const t = digits(F.tel), n = norm(F.nom);
  let res = [];
  if (t.length >= 3) res = S.clients.filter(c => digits(c.tel).includes(t));
  else if (n.length >= 2) res = S.clients.filter(c => norm(c.nom).includes(n));
  box.innerHTML = res.slice(0, 4).map(c => `<button type="button" class="sugg" data-a="fpick" data-id="${c.id}"><b>${esc(c.nom)}</b><span>${esc(c.tel)}</span></button>`).join('');
}

function updateTotals() {
  const el = $('#f-total');
  if (!el || !F) return;
  const pct = F.editId ? cmd(F.editId).expressPct : S.settings.expressPct;
  const t = calc(F.lignes, F.express, F.remise, pct);
  el.textContent = money(t.total);
  const r = $('#f-reste'), rd = $('#f-rendre'), av = Math.round(+F.avance || 0);
  if (F.editId) {
    const p = paye(cmd(F.editId));
    r.textContent = p ? `déjà payé ${money(p)}` : '';
  } else {
    r.textContent = av > 0 ? `reste ${money(Math.max(0, t.total - av))} après avance` : (t.total ? 'sans avance' : '');
    if (rd) rd.textContent = av > t.total && t.total > 0 ? `Monnaie à rendre : ${money(av - t.total)}` : '';
  }
  F.lignes.forEach(l => { const e = document.getElementById('lt-' + l.k); if (e) e.textContent = money(l.qte * l.pu); });
  const parts = [];
  if (t.maj || t.rem) parts.push('Sous-total ' + money(t.brut));
  if (t.maj) parts.push('express +' + money(t.maj));
  if (t.rem) parts.push('remise −' + money(t.rem));
  $('#f-detail').textContent = parts.join(', ');
}

function vDepot(id, q) {
  if (id) {
    const c = cmd(id);
    if (!c) return notFound("Cette commande n'existe pas.");
    if (!F || F.editId !== id) F = editForm(c);
  } else if (q.client) {
    if (!F || F.editId || F.clientId !== q.client) F = newForm(q.client);
  } else if (!F || F.editId) {
    F = newForm();
  }
  if (!S.services.find(s => s.id === F.service)) F.service = S.services[0].id;
  const c = id ? cmd(id) : null;
  const counts = {};
  F.lignes.forEach(l => { if (l.articleId && l.serviceId === F.service) counts[l.articleId] = (counts[l.articleId] || 0) + l.qte; });
  const draft = !id && (F.lignes.length || F.nom || F.tel);

  return `<header class="bar"><a class="icon-btn" href="#/${id ? 'commande/' + id : 'accueil'}" aria-label="Retour">${I.back}</a><h1>${id ? 'Modifier ' + esc(c.num) : 'Nouveau dépôt'}</h1>
      ${draft ? `<span class="bar-end"><button class="btn-t" data-a="fvider" data-confirm="Tout vider ?">Vider</button></span>` : ''}</header>

    <section class="sect"><h2>Client</h2>
      <div class="grid2">
        <label class="fld"><span>Téléphone</span><input id="f-tel" type="tel" inputmode="tel" data-in="ftel" value="${esc(F.tel)}" placeholder="70 00 00 00" autocomplete="off"></label>
        <label class="fld"><span>Nom</span><input id="f-nom" data-in="fnom" value="${esc(F.nom)}" placeholder="Nom du client" autocomplete="off" autocapitalize="words"></label>
      </div>
      <div id="f-sugg"></div>${clientInfo()}
    </section>

    <section class="sect"><h2>Articles</h2>
      <div class="seg seg-scroll" role="group" aria-label="Service">${S.services.map(sv => `<button class="chip ${F.service === sv.id ? 'on' : ''}" data-a="fsvc" data-id="${sv.id}" aria-pressed="${F.service === sv.id}">${esc(sv.nom)}</button>`).join('')}</div>
      <div class="art-grid">${S.articles.map(a => {
        const p = +a.prix[F.service] || 0, n = counts[a.id];
        return `<button class="art ${n ? 'has' : ''}" data-a="fadd" data-id="${a.id}" ${p ? '' : 'disabled'}><span>${esc(a.nom)}</span><small>${p ? money(p) : 'non proposé'}</small>${n ? `<em class="badge">${n}</em>` : ''}</button>`;
      }).join('')}<button class="art art-free" data-a="flibre"><span>Autre article</span><small>prix libre</small></button></div>
      <div id="f-lines">${linesHTML()}</div>
    </section>

    <section class="sect"><h2>Options</h2>
      <label class="switch"><input type="checkbox" data-ch="fexpress" ${F.express ? 'checked' : ''}><span class="sw"></span><span>Express <small>(+${c ? c.expressPct : S.settings.expressPct} %)</small></span></label>
      <div class="grid2">
        <label class="fld"><span>Retrait prévu le</span><input type="date" data-in="fdate" value="${F.date}"></label>
        <label class="fld"><span>Remise (F)</span><input type="number" inputmode="numeric" min="0" data-in="fremise" value="${F.remise || ''}" placeholder="0"></label>
      </div>
      <label class="fld"><span>Remarque générale</span><textarea data-in="fnote" rows="2" placeholder="Ex. : mettre sous housse, client pressé">${esc(F.note)}</textarea></label>
    </section>

    ${id ? '' : `<section class="sect"><h2>Avance</h2>
      <div class="grid2"><label class="fld"><span>Montant reçu (F)</span><input id="f-avance" type="number" inputmode="numeric" min="0" data-in="favance" value="${esc(F.avance)}" placeholder="0"></label>
        <div class="fld"><button class="btn btn-l" data-a="ftout">Tout payer</button></div></div>
      <div class="seg">${modeChips(F.mode, 'fmode')}</div>
      <p class="hint" id="f-rendre"></p>
    </section>`}

    <p class="fdetail" id="f-detail"></p>
    <div class="sticky-foot"><div class="tot"><span>Total</span><b id="f-total">0 F</b><small id="f-reste"></small></div>
      <button class="btn" data-a="fsave">${id ? 'Enregistrer' : 'Enregistrer le dépôt'}</button></div>`;
}

function fsave() {
  const lignes = F.lignes.filter(l => l.qte > 0);
  if (!lignes.length) return toast('Ajoutez au moins un article', 'err');
  if (lignes.some(l => !String(l.nom).trim())) return toast("Donnez un nom à l'article ajouté", 'err');
  const nom = F.nom.trim(), tel = F.tel.trim();
  if (!nom && !tel) { toast('Indiquez le nom ou le téléphone du client', 'err'); $('#f-tel')?.focus(); return; }
  if (!F.date) return toast('Indiquez la date de retrait prévue', 'err');

  let cl = F.clientId ? client(F.clientId) : null;
  if (!cl && digits(tel).length >= 8) {
    const k = digits(tel).slice(-8);
    cl = S.clients.find(c => digits(c.tel).slice(-8) === k);
  }
  if (cl) { if (nom) cl.nom = nom; if (tel) cl.tel = tel; }
  else { cl = {id: uid(), nom: nom || tel, tel, note: '', createdAt: new Date().toISOString()}; S.clients.push(cl); }

  const clean = lignes.map(({k, ...l}) => ({...l, nom: String(l.nom).trim(), qte: +l.qte, pu: Math.round(+l.pu || 0), note: (l.note || '').trim()}));

  if (F.editId) {
    const c = cmd(F.editId);
    const t = calc(clean, F.express, F.remise, c.expressPct);
    Object.assign(c, {clientId: cl.id, lignes: clean, express: F.express, brut: t.brut, maj: t.maj, remise: t.rem, total: t.total, dateRetraitPrevue: F.date, note: F.note.trim()});
    save();
    const trop = paye(c) - c.total;
    F = null;
    toast(trop > 0 ? `Modifié. Le client a payé ${money(trop)} de trop, à lui rendre.` : 'Commande modifiée');
    location.hash = '#/commande/' + c.id;
    return;
  }

  const s = S.settings, now = new Date().toISOString();
  const t = calc(clean, F.express, F.remise);
  const c = {id: uid(), num: numFmt(s.nextNum), clientId: cl.id, lignes: clean, express: F.express, expressPct: +s.expressPct || 0,
    brut: t.brut, maj: t.maj, remise: t.rem, total: t.total, dateDepot: now, dateRetraitPrevue: F.date, note: F.note.trim(),
    statut: 'depose', historique: [{statut: 'depose', date: now}], paiements: [], datePret: null, dateRetrait: null, notifieLe: null};
  s.nextNum++;
  const av = Math.min(Math.round(+F.avance || 0), t.total);
  if (av > 0) c.paiements.push({id: uid(), montant: av, mode: F.mode, date: now});
  S.commandes.push(c);
  save();
  F = null;
  location.hash = `#/commande/${c.id}?nouveau=1`;
}

/* ---------- Clients ---------- */
function cliIndex() {
  const idx = {};
  S.commandes.forEach(c => {
    if (c.statut === 'annule') return;
    const o = idx[c.clientId] || (idx[c.clientId] = {n: 0, dette: 0, paye: 0});
    o.n++; o.dette += reste(c); o.paye += paye(c);
  });
  return idx;
}

function cliListHTML() {
  if (!S.clients.length) return `<div class="card empty"><p>Les clients s'ajoutent automatiquement à chaque dépôt.</p><a class="btn btn-p" href="#/depot">${I.plus} Nouveau dépôt</a></div>`;
  const q = cliQ.trim(), d = digits(q), n = norm(q), idx = cliIndex();

/* ---------- QR code du ticket ----------
   Le QR contient un lien vers l'app : #/t/<n° de ticket>/<identifiant>?w=<WhatsApp du pressing>.
   - Scanné sur le téléphone du pressing (scanner de l'app ou appareil photo) : ouvre la commande.
   - Scanné par le client : page « Demander si mon linge est prêt » via WhatsApp.
   Aucune donnée du client (nom, montant) n'est dans le QR. */
const appBase = () => location.origin + location.pathname.replace(/index\.html$/, '');
function whatsappPressing() {
  let w = digits(S.settings.tel);
  if (w && w.length <= 8) w = digits(S.settings.indicatif) + w;
  return w;
}
function ticketURL(c) {
  const w = whatsappPressing();
  return `${appBase()}#/t/${encodeURIComponent(c.num)}/${c.id || ''}${w ? '?w=' + w : ''}`;
}
// Chaque « carré » du QR fait un nombre entier de points de la tête d'impression :
// sur une thermique à 203 dpi, 5 points = 0,625 mm. Des carrés réguliers = un QR lisible.
function qrSVG(text, moduleMM = 0.625) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), m = 2, taille = ((n + 2 * m) * moduleMM).toFixed(3);
  let d = '';
  for (let r = 0; r < n; r++) for (let x = 0; x < n; x++) if (q.isDark(r, x)) d += `M${x + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" style="width:${taille}mm;height:${taille}mm" shape-rendering="crispEdges" role="img" aria-label="QR code du ticket"><rect width="100%" height="100%" fill="#fff" stroke="none"/><path d="${d}" fill="#000" stroke="none"/></svg>`;
}
function findTicket(text) {
  const t = String(text || '').trim(), m = t.match(/#\/t\/([^/?#]+)\/?([^?#]*)/);
  const num = m ? decodeURIComponent(m[1]) : t;
  return (m && m[2] && cmd(m[2])) || S.commandes.find(c => c.num === num) || null;
}

      ${c.note ? `<div class="tk-sep"></div><small>${esc(c.note)}</small>` : ''}</div>`;

// Formats de ticket. Sur un rouleau thermique, la tête d'impression ne couvre pas toute la largeur :
// 48 mm imprimables sur un rouleau de 58 mm, 72 mm sur un rouleau de 80 mm.
// qr = taille d'un carré du QR en mm (5 points à 203 dpi sur les thermiques)
const PAPIER = {
  58: {label: 'Rouleau 58 mm', papier: 58, zone: 48, fs: '10pt', qr: 0.625},
  80: {label: 'Rouleau 80 mm', papier: 80, zone: 72, fs: '11pt', qr: 0.625},
  A4: {label: 'Feuille A4', papier: 'A4', zone: 80, fs: '11pt', qr: 0.6}
};
function imprimer(c, cl) {
  const cfg = PAPIER[S.settings.largeur] || PAPIER[58], p = $('#print');
  p.innerHTML = ticketHTML(c, cl);
  p.style.setProperty('--ticket-w', cfg.zone + 'mm');
  p.style.setProperty('--ticket-fs', cfg.fs);
  let page;
  if (cfg.papier === 'A4') page = 'size:A4;margin:12mm';
  else {
    // Hauteur de page = hauteur réelle du ticket + 4 mm de marge en haut et en bas
    p.classList.add('measure');
    const hauteur = Math.ceil(p.getBoundingClientRect().height * 25.4 / 96) + 8;
    p.classList.remove('measure');
    page = `size:${cfg.papier}mm ${hauteur}mm;margin:4mm ${(cfg.papier - cfg.zone) / 2}mm`;
  }
  $('#page-style').textContent = `@page{${page}}`;
  setTimeout(() => window.print(), 60);
}

/* ---------- Sauvegarde ---------- */
async function exporter(mode) {
  const payload = JSON.stringify({app: 'PressingPro', version: VERSION, exportedAt: new Date().toISOString(), data: S});
  const base = `pressingpro-sauvegarde-${dISO()}`;
  const mark = () => { S.settings.lastBackup = new Date().toISOString(); save(); if (parseHash().name !== 'depot') render(); };
  if (mode === 'share' && navigator.share && navigator.canShare) {
    const files = [new File([payload], base + '.json', {type: 'application/json'}), new File([payload], base + '.txt', {type: 'text/plain'})];
    const f = files.find(x => { try { return navigator.canShare({files: [x]}); } catch (e) { return false; } });
    if (f) {
      try { await navigator.share({files: [f], title: 'Sauvegarde PressingPro'}); mark(); toast('Sauvegarde partagée'); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([payload], {type: 'application/json'}));
  a.download = base + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  mark();
  toast(mode === 'share' ? 'Partage indisponible ici : sauvegarde téléchargée' : 'Sauvegarde téléchargée');
}

/* ---------- Actions (clics) ---------- */
const A = {
  periode(el) {
    const was = periode;
    periode = el.dataset.id;
    if (periode === 'date' && caisseDate < premierJour()) caisseDate = premierJour();
    render();
    // Premier appui sur « Autre date » (ou nouvel appui dessus) : on ouvre directement le calendrier
    if (periode === 'date') { const d = $('#c-date'); try { d.showPicker(); } catch (e) { d.focus(); } }
    else if (was === 'date') $('.receipt')?.scrollIntoView({block: 'nearest'});
  },
  cprev() { caisseDate = addDaysFrom(caisseDate, -1); render(); },
  cnext() { const n = addDaysFrom(caisseDate, 1); caisseDate = n > dISO() ? dISO() : n; render(); },
  cfilter(el) { cmdFilter = el.dataset.id; cmdQ = ''; cmdLimit = 60; location.hash = '#/commandes/' + cmdFilter; },
  more() { cmdLimit += 60; $('#cmd-list').innerHTML = cmdListHTML(); },

  setst(el) {
    const c = cmd(el.dataset.id), s = el.dataset.s;
    if (s === 'retire') { ui.remise = c.id; render(); $('#remise')?.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
    ui.remise = null;
    setStatut(c, s);
    toast(s === 'pret' ? `${c.num} est prêt. Prévenez le client.` : `${c.num} : ${STATUTS[s].toLowerCase()}`);
    render();
  },
  notif(el) { const c = cmd(el.dataset.id); c.notifieLe = new Date().toISOString(); save(); setTimeout(render, 400); },
  remettre(el) {
    const c = cmd(el.dataset.id), r = reste(c);
    let rendre = 0;
    if (el.dataset.pay === '1') {
      const m = Math.round(+$('#pay-m').value || 0);
      if (m <= 0) { toast('Indiquez le montant reçu', 'err'); $('#pay-m').focus(); return; }
      const rec = Math.min(m, r);
      rendre = m - rec;
      c.paiements.push({id: uid(), montant: rec, mode: payMode, date: new Date().toISOString()});
    }
    ui.remise = null;
    setStatut(c, 'retire');
    const rr = reste(c);
    toast(rendre > 0 ? `Linge remis. Monnaie à rendre : ${money(rendre)}` : rr > 0 ? `Linge remis. Reste dû : ${money(rr)}` : 'Linge remis au client');
    render();
  },
  encaisser(el) {
    const c = cmd(el.dataset.id), r = reste(c), m = Math.round(+$('#pay-m').value || 0);
    if (m <= 0) { toast('Indiquez le montant reçu', 'err'); $('#pay-m').focus(); return; }
    const rec = Math.min(m, r);
    c.paiements.push({id: uid(), montant: rec, mode: payMode, date: new Date().toISOString()});
    save();
    toast(m > rec ? `Encaissé. Monnaie à rendre : ${money(m - rec)}` : `${money(rec)} encaissés`);
    render();
  },
  paydel(el) { const c = cmd(el.dataset.id); c.paiements = c.paiements.filter(p => p.id !== el.dataset.p); save(); toast('Paiement supprimé'); render(); },
  pmode(el) { payMode = el.dataset.id; el.parentElement.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b === el)); },
  annuler(el) {
    const c = cmd(el.dataset.id), now = new Date().toISOString();
    c.statutAvant = c.statut; c.statut = 'annule'; c.dateAnnule = now; c.historique.push({statut: 'annule', date: now});
    save(); toast('Commande annulée'); render();
  },
  retablir(el) {
    const c = cmd(el.dataset.id);
    c.statut = c.statutAvant || 'depose'; delete c.dateAnnule; c.historique.push({statut: c.statut, date: new Date().toISOString()});
    save(); toast('Commande rétablie'); render();
  },
  print(el) { imprimer(cmd(el.dataset.id)); },
  scan() { location.hash = '#/scan'; },
  printtest() { ticketEssai(); },

  // Formulaire de dépôt
  fsvc(el) { F.service = el.dataset.id; render(); },
  fadd(el) {
    const a = S.articles.find(x => x.id === el.dataset.id), sv = svc(F.service), p = +a.prix[sv.id] || 0;
    const ex = F.lignes.find(l => l.articleId === a.id && l.serviceId === sv.id && !l.note);
    if (ex) ex.qte++;
    else F.lignes.push({k: uid(), articleId: a.id, nom: a.nom, serviceId: sv.id, serviceNom: sv.nom, qte: 1, pu: p, note: ''});
    render();
  },
  flibre() {
    const sv = svc(F.service), k = uid();
    F.lignes.push({k, articleId: null, libre: true, nom: '', serviceId: sv.id, serviceNom: sv.nom, qte: 1, pu: 0, note: ''});
    render();
    $(`[data-in="lnom"][data-k="${k}"]`)?.focus();
  },
  ldel(el) { F.lignes = F.lignes.filter(l => l.k !== el.dataset.k); render(); },
  lmoins(el) { const l = line(el.dataset.k); if (l.qte > 1) { l.qte--; render(); } else toast('Utilisez la croix pour retirer l\'article'); },
  lplus(el) { line(el.dataset.k).qte++; render(); },
  lnoteopen(el) { F.noteOpen[el.dataset.k] = true; render(); $(`[data-in="lnote"][data-k="${el.dataset.k}"]`)?.focus(); },
  fmode(el) { F.mode = el.dataset.id; el.parentElement.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b === el)); },
  ftout() { const t = calc(F.lignes, F.express, F.remise); F.avance = String(t.total); $('#f-avance').value = F.avance; updateTotals(); },
  fvider() { F = newForm(); render(); },
  fpick(el) { const c = client(el.dataset.id); F.clientId = c.id; F.tel = c.tel; F.nom = c.nom; render(); },
  fchange() { F.clientId = null; F.tel = ''; F.nom = ''; render(); $('#f-tel')?.focus(); },
  fsave() { fsave(); },

  // Clients
  clidel(el) { S.clients = S.clients.filter(c => c.id !== el.dataset.id); save(); toast('Client supprimé'); location.hash = '#/clients'; },

  // Tarifs
  svcadd() { S.services.push({id: uid(), nom: 'Nouveau service'}); save(); render(); const ins = document.querySelectorAll('[data-ch="svcnom"]'); const last = ins[ins.length - 1]; last?.focus(); last?.select(); },
  svcdel(el) {
    if (S.services.length <= 1) return toast('Il faut garder au moins un service', 'err');
    S.services = S.services.filter(s => s.id !== el.dataset.id);
    save(); toast('Service supprimé'); render();
  },
  artadd() { S.articles.push({id: uid(), nom: 'Nouvel article', prix: {}}); save(); render(); const ins = document.querySelectorAll('.tarif-nom'); const last = ins[ins.length - 1]; last?.focus(); last?.select(); },
  artdel(el) { S.articles = S.articles.filter(a => a.id !== el.dataset.id); save(); toast('Article supprimé'); render(); },

  // Sauvegarde et divers
  bkshare() { exporter('share'); },
  bkdl() { exporter('dl'); },
  impok() { const bk = pendingImport.date; S = migrate(pendingImport.d); if (bk) S.settings.lastBackup = bk; pendingImport = null; F = null; save(); toast('Données restaurées'); location.hash = '#/accueil'; render(); },
  impno() { pendingImport = null; render(); },
  reset() {
    const v = ($('#reset-in').value || '').trim().toUpperCase();
    if (v !== 'EFFACER') { toast('Tapez EFFACER pour confirmer', 'err'); return; }
    S = defaultState(); F = null; save(); toast('Toutes les données ont été effacées'); location.hash = '#/accueil'; render();
  },
  install() {
    if (!deferredInstall) return;
    const ev = deferredInstall;
    ev.prompt();
    ev.userChoice.then(ch => { if (ch.outcome !== 'accepted') installLater = true; }).finally(() => { deferredInstall = null; render(); });
  },
  installlater() { installLater = true; render(); }
};

/* ---------- Saisie (input) ---------- */
const IN = {
  qhome(el) {
    const q = el.value.trim(), box = $('#home-res');
    if (!q) { box.innerHTML = ''; return; }
    const rank = c => ({pret: 0, depose: 1, traitement: 1, retire: 2, annule: 3})[c.statut];
    const res = S.commandes.filter(c => matchQ(c, q)).sort((a, b) => rank(a) - rank(b) || b.dateDepot.localeCompare(a.dateDepot)).slice(0, 8);
    box.innerHTML = res.length ? `<div class="list" style="margin-bottom:8px">${res.map(c => rowCmd(c)).join('')}</div>` : `<p class="muted pad">Aucune commande trouvée pour « ${esc(q)} ».</p>`;
  },
  qcmd(el) { cmdQ = el.value; cmdLimit = 60; $('#cmd-list').innerHTML = cmdListHTML(); },
  qcli(el) { cliQ = el.value; $('#cli-list').innerHTML = cliListHTML(); },
  paym(el) {
    const r = +el.dataset.r, m = Math.round(+el.value || 0), out = $('#pay-rendre');
    out.textContent = m > r ? `Monnaie à rendre : ${money(m - r)}` : (m > 0 && m < r ? `Il restera ${money(r - m)} à payer` : '');
  },
  ftel(el) { F.tel = el.value; suggest(); },
  fnom(el) { F.nom = el.value; suggest(); },
  lpu(el) { line(el.dataset.k).pu = Math.max(0, Math.round(+el.value || 0)); updateTotals(); },
  lnom(el) { line(el.dataset.k).nom = el.value; },
  lnote(el) { line(el.dataset.k).note = el.value; },
  fdate(el) { F.date = el.value; },
  fremise(el) { F.remise = Math.max(0, Math.round(+el.value || 0)); updateTotals(); },
  fnote(el) { F.note = el.value; },
  favance(el) { F.avance = el.value; updateTotals(); }
};

/* ---------- Changements (change) ---------- */
const CH = {
  cdate(el) {
    const v = el.value, today = dISO();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    caisseDate = v > today ? today : v;
    render();
  },
  lsvc(el) {
    const l = line(el.dataset.k), sv = svc(el.value);
    l.serviceId = sv.id; l.serviceNom = sv.nom;
    if (l.articleId) { const a = S.articles.find(x => x.id === l.articleId); const p = a && +a.prix[sv.id]; if (p) l.pu = p; }
    render();
  },
  fexpress(el) { F.express = el.checked; if (!F.editId) F.date = addDays(el.checked ? 1 : (+S.settings.delai || 0)); render(); },
  set(el) {
    const k = el.dataset.k;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') { v = Math.max(0, Math.round(+el.value || 0)); if (k === 'joursOubli') v = Math.max(1, v); el.value = v; }
    else v = el.value.trim();
    if (k === 'nom' && !v) { v = 'Mon pressing'; el.value = v; }
    if (k === 'largeur') v = v === 'A4' ? 'A4' : +v;
    if (k === 'indicatif') { v = digits(v) || '226'; el.value = v; }
    if (k === 'prefixe') { v = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); el.value = v; }
    S.settings[k] = v;
    save();
    toast('Enregistré');
    if (['prefixe', 'largeur', 'qr', 'tel'].includes(k)) render();
  },
  cli(el) {
    const c = client(el.dataset.id), f = el.dataset.f, v = el.value.trim();
    if (f === 'nom' && !v) { el.value = c.nom; toast('Le nom ne peut pas être vide', 'err'); return; }
    c[f] = v; save(); toast('Fiche client enregistrée');
    if (f === 'nom') $('.bar h1').textContent = v;
  },
  svcnom(el) { const sv = svc(el.dataset.id), v = el.value.trim(); if (!v) { el.value = sv.nom; return; } sv.nom = v; save(); toast('Service renommé'); },
  artnom(el) { const a = S.articles.find(x => x.id === el.dataset.id), v = el.value.trim(); if (!v) { el.value = a.nom; return; } a.nom = v; save(); toast('Enregistré'); },
  artprix(el) {
    const a = S.articles.find(x => x.id === el.dataset.id), v = Math.max(0, Math.round(+el.value || 0));
    a.prix[el.dataset.s] = v; el.value = v || ''; save(); toast('Prix enregistré');
  },
  bkimport(el) {
    const f = el.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result), d = o && o.data ? o.data : o;
        if (!d || !d.settings || !Array.isArray(d.commandes) || !Array.isArray(d.clients) || !Array.isArray(d.articles) || !Array.isArray(d.services)) throw new Error('format');
        pendingImport = {d, date: o.exportedAt || null};
        render();
        $('#imp')?.scrollIntoView({block: 'center'});
      } catch (e) { toast("Ce fichier n'est pas une sauvegarde PressingPro valide", 'err'); }
      el.value = '';
    };
    rd.readAsText(f);
  }
};

/* ---------- Ticket scanné (lien du QR code) ---------- */
function vTicket(numEnc, q, oid) {
  let num = '';
  try { num = decodeURIComponent(numEnc || ''); } catch (e) { num = numEnc || ''; }
  const c = (oid && cmd(oid)) || S.commandes.find(x => x.num === num);
  if (c) { setTimeout(() => location.replace('#/commande/' + c.id), 0); return ''; }
  if (S.commandes.length) {
    // Téléphone du pressing, mais ticket inconnu (ticket d'essai, données effacées…)
    return `<header class="bar"><a class="icon-btn" href="#/accueil" aria-label="Retour à l'accueil">${I.back}</a><h1>Ticket ${esc(num)}</h1></header>
      <p class="card warn-card">Ce ticket ne correspond à aucune commande enregistrée sur ce téléphone.</p>`;
  }
  // Téléphone du client
  const w = digits(q.w);
  const msg = `Bonjour, je voudrais savoir si mon linge (ticket ${num}) est prêt. Merci !`;
  return `<section class="public"><span class="tag tag-lg">${esc(num)}</span>
    <h1>Votre ticket de pressing</h1>
    <p>Gardez bien ce ticket : il faut le présenter pour récupérer votre linge.</p>
    ${w ? `<a class="btn btn-g block big-wa" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${I.chat} Demander si mon linge est prêt</a>
      <a class="btn btn-l block" href="tel:+${w}">${I.phone} Appeler le pressing</a>` : ''}
  </section>`;
}

/* ---------- Scanner de tickets (caméra) ---------- */
let scanStream = null, scanTimer = null, scanRefus = '';
function vScan() {
  return `<header class="bar"><a class="icon-btn" href="#/accueil" aria-label="Fermer le scanner">${I.back}</a><h1>Scanner un ticket</h1></header>
    <div class="scan-box"><video id="scan-v" playsinline muted></video><span class="scan-frame" aria-hidden="true"></span></div>
    <p class="hint scan-msg" id="scan-msg" role="status">Ouverture de la caméra…</p>`;
}
function stopScan() {
  clearTimeout(scanTimer);
  scanTimer = null;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
async function startScan() {
  stopScan();
  const msg = $('#scan-msg'), v = $('#scan-v');
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) {
    msg.textContent = "Le scanner intégré n'est pas disponible sur ce navigateur. Utilisez l'appareil photo du téléphone : le QR code du ticket ouvre directement la commande.";
    return;
  }
  let det;
  try { det = new BarcodeDetector({formats: ['qr_code']}); }
  catch (e) { msg.textContent = "Le scanner intégré n'est pas disponible sur ce téléphone. Utilisez l'appareil photo : le QR code ouvre directement la commande."; return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false}); }
  catch (e) {
    msg.textContent = e.name === 'NotAllowedError'
      ? "L'accès à la caméra est refusé. Autorisez la caméra pour cette application dans les réglages de Chrome, puis réessayez."
      : "Impossible d'ouvrir la caméra de ce téléphone.";
    return;
  }
  if (parseHash().name !== 'scan') { stream.getTracks().forEach(t => t.stop()); return; }
  scanStream = stream;
  v.srcObject = stream;
  await v.play().catch(() => {});
  msg.textContent = 'Visez le QR code imprimé sur le ticket du client.';
  scanRefus = '';
  const tick = async () => {
    if (!scanStream) return;
    try {
      const codes = await det.detect(v);
      if (codes.length && ouvrirScan(codes[0].rawValue)) return;
    } catch (e) { /* image pas encore prête */ }
    scanTimer = setTimeout(tick, 250);
  };
  tick();
}
function ouvrirScan(texte) {
  const c = findTicket(texte);
  if (!c) {
    if (texte !== scanRefus) {
      scanRefus = texte;
      $('#scan-msg').textContent = 'Ce QR code ne correspond à aucune commande de ce téléphone.';
      if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
    }
    return false;
  }
  stopScan();
  if (navigator.vibrate) navigator.vibrate(80);
  toast(`Ticket ${c.num}`);
  location.replace('#/commande/' + c.id);
  return true;
}

/* ---------- Routeur ---------- */
function parseHash() {
  const h = (location.hash || '#/accueil').replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const [name, id, id2] = path.split('/');
  return {name: name || 'accueil', id, id2, q: Object.fromEntries(new URLSearchParams(qs || ''))};
}
const VIEWS = {accueil: vAccueil, commandes: vCommandes, commande: vCommande, depot: vDepot, clients: vClients, client: vClient, reglages: vReglages, tarifs: vTarifs, t: vTicket, scan: vScan};
const NAV = [['accueil', 'Accueil', 'home'], ['commandes', 'Commandes', 'list'], ['depot', 'Dépôt', 'plus'], ['clients', 'Clients', 'users'], ['reglages', 'Réglages', 'sliders']];
let lastHash = null;

function render() {
  const r = parseHash(), fn = VIEWS[r.name] || vAccueil;
  if (r.name !== 'scan') stopScan();
  $('#view').innerHTML = fn(r.id, r.q, r.id2);
  const cur = {commande: 'commandes', client: 'clients', tarifs: 'reglages', scan: 'accueil'}[r.name] || r.name;
  // La page « ticket » vue par un client n'affiche pas la navigation du pressing
  $('#nav').hidden = r.name === 't' && !S.commandes.length;
  $('#nav').innerHTML = NAV.map(([k, label, ic]) => `<a href="#/${k}" ${k === cur ? 'aria-current="page"' : ''}>${k === 'depot' ? `<span class="plus">${I[ic]}</span>` : I[ic]}<span>${label}</span></a>`).join('');
  if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; }
  if (r.name === 'depot' && F) { updateTotals(); suggest(); }
  if (r.name === 'commandes') $('.seg-scroll .chip.on')?.scrollIntoView({inline: 'center', block: 'nearest'});
  if (r.name === 'scan') startScan();
}

/* ---------- Écouteurs ---------- */
function disarm(el) {
  clearTimeout(el._t);
  if (el.dataset.label != null) { el.innerHTML = el.dataset.label; delete el.dataset.label; }
  el.classList.remove('armed');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.confirm && !el.classList.contains('armed')) {
    e.preventDefault();
    document.querySelectorAll('.armed').forEach(disarm);
    el.dataset.label = el.innerHTML;
    el.textContent = el.dataset.confirm;
    el.classList.add('armed');
    el._t = setTimeout(() => disarm(el), 4000);
    return;
  }
  if (el.classList.contains('armed')) disarm(el);
  const fn = A[el.dataset.a];
  if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target, e); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && CH[k]) CH[k](e.target, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q-home') {
    const rows = document.querySelectorAll('#home-res .row');
    if (rows.length === 1) location.hash = rows[0].getAttribute('href');
  }
});
window.addEventListener('hashchange', () => { ui.remise = null; if (parseHash().name !== 'reglages') pendingImport = null; render(); });
// On garde la proposition d'installation de Chrome pour l'afficher nous-mêmes sur l'accueil
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if (['accueil', 'reglages'].includes(parseHash().name)) render();
});
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('PressingPro est installée sur ce téléphone'); if (parseHash().name !== 'depot') render(); });

// Mode « Version pour ordinateur » sur téléphone : la page est affichée sur ~980 px
// alors que l'écran en fait ~400. On prévient l'utilisateur au lieu de le laisser plisser les yeux.
function checkDesktopMode() {
  const tactile = window.matchMedia('(pointer: coarse)').matches;
  $('#dm').hidden = !(tactile && screen.width < 700 && window.innerWidth > screen.width * 1.5);
}
window.addEventListener('resize', checkDesktopMode);

/* ---------- Démarrage ---------- */
(async function init() {
  checkDesktopMode();
  await Store.open();
  let d = null;
  try { d = await Store.load(); } catch (e) { console.error(e); }
  S = d ? migrate(d) : defaultState();
  if (!d && parseHash().name !== 't') save(); // un client qui scanne son ticket ne crée pas de données
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
